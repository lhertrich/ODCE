num_classes: 365
device: "cuda"  # or "cpu" depending on your setup
model: adapter_detr # [org_detr, adapter_detr]

test:
  model:
    _target_: model_code.adapterDETR.AdapterDetr
    train_decoder: true
    train_class_head: true
    train_bbox_head: true
    num_queries: 5
    adapter:
      _target_: model_code.transformerAdapter.TransformerAdapter
      input_dim: 512 
      output_dim: 256
      seq_len: 197

  checkpoint_dir: "./checkpoints/rq1-image-text/1"
  final_checkpoint_name: "text_embedding_1.pth"

  data:
    dataset_path: "./dataset/refl4"
    feature_path: "./data/full-longclip-emb"
    batch_size: 32
    shuffle: true
    load_images: false
    load_features: true
    num_workers: 4
    cache_dir: "./data/cache/images"

  wandb:
    project: "Test-text-embeddings"
    entity: "visiblyintelligent"
    name: "${test.final_checkpoint_name}"
