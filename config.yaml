num_classes: 365
device: "cuda"  # or "cpu" depending on your setup
model: orgDETR # [org_detr, adapter_detr]
num_queries: 2

org_detr:
  _target_: model_code.orgDETR_fix.Detr
  model_checkpoint: "facebook/detr-resnet-50"
  freeze_backbone: true
  freeze_all: false
  num_classes: ${num_classes}
  num_queries: ${num_queries}

  # hidden_dim: 256
  # nheads: 8
  # dim_feedforward: 2048
  # dropout: 0.1
  # activation: "relu"
  # num_encoder_layers: 6
  # num_decoder_layers: 6
  # pre_norm: true
  # return_intermediate_dec: false

adapter_detr:
  _target_: model_code.adapterDETR.AdapterDetr
  train_decoder: true
  train_class_head: true
  train_bbox_head: true
  num_queries: 5
  adapter:
    _target_: model_code.transformerAdapter.TransformerAdapter
    input_dim: 512
    output_dim: 256
    seq_len: 197

optimizer:
  _target_: torch.optim.AdamW

train:
  num_devices: 1
  epochs: 100
  max_train_steps: 100000
  batch_size: 1
  checkpoint_dir: "./outputs/train-freeze-backbone-num-queries-${num_queries}"
  final_checkpoint_name: "/epoch=8-step=10000-val/total_loss=3.31.ckpt"
  resume_checkpoint_dir: "${train.checkpoint_dir}/outputs/train-freeze-backbone/epoch=61-step=70000-val/total_loss=2.15.ckpt"
  save_interval: 10000
  lr: 1e-4
  weight_decay: 1e-4
  warmup_steps: 500

wandb:
  project: "test-orgdetr"
  entity: "visiblyintelligent"
  name: "freeze-backbone-num-queries-${num_queries}"
  
data:
  # dataset_name: "JierunChen/Ref-L4"
  dataset_path: "./dataset/refl4"
  feature_path: "./data/full-longclip-emb"
  batch_size: 32
  shuffle: true
  load_images: true
  load_features: false
  num_workers: 4
  cache_dir: "./data/cache/images"
