num_classes: 365
device: "cpu"  # or "cpu" depending on your setup
model: orgDETR # [orgDETR, adapterDETR]
org_detr:
  _target_: models.orgDETR_fix.Detr  # Replace with actual module path
  # num_queries: 100
  # hidden_dim: 256
  # nheads: 8
  # dim_feedforward: 2048
  # dropout: 0.1
  # activation: "relu"
  # num_encoder_layers: 6
  # num_decoder_layers: 6
  # pre_norm: true
  # return_intermediate_dec: false

adapter_detr:
  _target_: model_code.adapterDETR.AdapterDetr
  train_decoder: true
  train_class_head: true
  train_bbox_head: true
  adapter:
    _target_: model_code.transformerAdapter.TransformerAdapter    # Replace with actual module path
    input_dim: 512   # Reference variables or hardcode values
    output_dim: 256
    seq_len: 197


optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0001

train:
  num_devices: 1
  epochs: 30
  batch_size: 1
  checkpoint_dir: "./checkpoints/rq1-image-only"
  org_checkpoint_dir: "./checkpoints/org_detr"
  resume_checkpoint_dir: ""
  org_resume_checkpoint_dir: ""
  save_interval: 1000
  val_check_interval: 1000

wandb:
  project: "train-detr"
  entity: "visiblyintelligent"
  name: "${train.final_checkpoint_name}"

data: 
  dataset_name: "JierunChen/Ref-L4"
  feature_path: "./data/longclip-emb"
  batch_size: 32
  shuffle: true
  load_images: false
  load_features: true
  num_workers: 4
