### HERE PUT THE MODEL AND CHECKPOINT YOU WISH TO EVALUATE ###
model: adapter_detr # [org_detr, adapter_detr]


num_classes: 365
device: "cuda"  # or "cpu" depending on your setup

org_detr:
  _target_: models.orgDETR.Detr  # Replace with actual module path
  # num_queries: 100
  # hidden_dim: 256
  # nheads: 8
  # dim_feedforward: 2048
  # dropout: 0.1
  # activation: "relu"
  # num_encoder_layers: 6
  # num_decoder_layers: 6
  # pre_norm: true
  # return_intermediate_dec: false

adapter_detr:
  _target_: model_code.adapterDETR.AdapterDetr
  train_decoder: true
  train_class_head: true
  train_bbox_head: true
  num_queries: 1
  adapter:
    _target_: model_code.transformerAdapter.TransformerAdapter    # Replace with actual module path
    input_dim: 512   # Reference variables or hardcode values
    output_dim: 256
    seq_len: 197

train:
  batch_size: 1
  checkpoint_dir: "./checkpoints/rq1-image-only"
  org_checkpoint_dir: "./checkpoints/org_detr"
  final_checkpoint_name: "1oq-1,5,2,0.1_losses-fullimage.pth"
  resume_checkpoint_dir: "${train.checkpoint_dir}/${train.final_checkpoint_name}"
  org_resume_checkpoint_dir: "${train.org_checkpoint_dir}/${train.final_checkpoint_name}"
  
wandb:
  project: "full-image"
  entity: "visiblyintelligent"
  name: "back-bone-freeze"

data:
  dataset_path: "../dataset/refl4"
  feature_path: "/scratch/izar/veski/longclip-new"
  batch_size: 1
  shuffle: false
  split: "test"
  load_images: true
  load_features: true
  num_workers: 1